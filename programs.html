<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ScholarTrack | Programs</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div id="app"></div>


<div
    id="programModal"
    class="modal-overlay"
>

    <div class="modal">

        <div class="modal-header">

            <h3 id="programModalTitle">
                Add Scholarship Program
            </h3>

            <button
                type="button"
                class="modal-close"
            >
                ×
            </button>

        </div>


        <form id="programForm">

            <div class="modal-body">

                <input
                    type="hidden"
                    id="programId"
                >


                <div class="form-grid">

                    <div class="form-group full">

                        <label>
                            Scholarship Program Name *
                        </label>

                        <input
                            type="text"
                            id="programName"
                            placeholder="e.g. Academic Excellence Scholarship"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Required GWA *
                        </label>

                        <input
                            type="number"
                            id="requiredGwa"
                            min="1"
                            max="5"
                            step="0.01"
                            placeholder="e.g. 1.75"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Minimum Units *
                        </label>

                        <input
                            type="number"
                            id="minUnits"
                            min="0"
                            step="1"
                            placeholder="e.g. 18"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Allow Failing Grade?
                        </label>

                        <select id="allowFailing">

                            <option value="false">
                                No
                            </option>

                            <option value="true">
                                Yes
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Program Status
                        </label>

                        <select id="programActive">

                            <option value="true">
                                Active
                            </option>

                            <option value="false">
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary modal-close"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Program
                </button>

            </div>

        </form>

    </div>

</div>


<script
    type="module"
    src="js/programs.js"
></script>

</body>
</html>
